[tool.poetry]
name = "job-search"
version = "0.1.0"
description = "Personal job search aggregation and tracking tool"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "~3.13"
fastapi = "^0.135.2"
uvicorn = {extras = ["standard"], version = "^0.42.0"}
sqlalchemy = "^2.0.48"
pydantic = "^2.12.5"
pydantic-settings = "^2.13.1"
requests = "^2.33.1"
tenacity = "^9.1.4"
beautifulsoup4 = "^4.14.3"
lxml = "^6.0.2"
scikit-learn = "^1.8.0"
numpy = "^2.4.4"
pandas = "^3.0.2"
spacy = "^3.8.14"
sentence-transformers = "^5.3.0"
python-multipart = "^0.0.22"
python-docx = "^1.2.0"
pypdf = "^6.9.2"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
httpx = "^0.28.1"
ruff = "^0.15.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "I001", "UP043"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: tests that make real external API calls (deselected by default)",
]
